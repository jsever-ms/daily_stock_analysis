name: 股票深度分析任务（单股手动）

on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: '股票代码（如 600519 / hk00700 / AAPL）'
        required: true
      cost_price:
        description: '买入成本价（0 = 不启用私人投顾模式）'
        required: false
        default: '0'
      position_ratio:
        description: '持仓比例 %（0-100，配合买入成本使用）'
        required: false
        default: '0'

# 并发控制：同一时间只运行一个分析任务
concurrency:
  group: single-stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建必要目录
        run: mkdir -p data logs reports

      - name: 执行单股深度分析
        env:
          # AI 配置：Gemini 主选，硅基流动（SILICON_FLOW_KEY）作为 OpenAI 兼容备选
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.SILICON_FLOW_KEY }}
          OPENAI_BASE_URL: https://api.siliconflow.cn/v1
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'deepseek-ai/DeepSeek-V3.1' }}
          # 通知：复用已有 TG_TOKEN / TG_CHAT_ID secrets，映射到应用读取的环境变量名
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 数据源（可选）
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TZ: Asia/Shanghai
        run: |
          echo "=========================================="
          echo "🚀 单股深度分析（私人投顾模式）"
          echo "📊 股票代码: ${{ github.event.inputs.stock_code }}"
          echo "💰 买入成本: ${{ github.event.inputs.cost_price }}"
          echo "📈 持仓比例: ${{ github.event.inputs.position_ratio }}%"
          echo "=========================================="
          python main.py \
            --stocks "${{ github.event.inputs.stock_code }}" \
            --cost-price "${{ github.event.inputs.cost_price }}" \
            --position-ratio "${{ github.event.inputs.position_ratio }}" \
            --force-run \
            --single-notify \
            --no-market-review

      - name: 上传分析报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-stock-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 7
